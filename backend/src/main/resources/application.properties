spring.application.name=ours-backend

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/ours
spring.datasource.username=ours_user
spring.datasource.password=${OURS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${OURS_JWT_SECRET}
app.jwt.expiration=604800000

# Error Response Security
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never