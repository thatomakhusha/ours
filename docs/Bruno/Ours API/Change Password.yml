info:
  name: Change Password
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/auth/change-password
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{currentPassword}}",
        "newPassword": "{{newPassword}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
