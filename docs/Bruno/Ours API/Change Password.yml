info:
  name: Change Password
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/auth/change-password
  headers:
    - name: Content-Type
      value: application/json
    - name: X-XSRF-TOKEN
      value: "{{csrfToken}}"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{currentPassword}}",
        "newPassword": "{{newPassword}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
